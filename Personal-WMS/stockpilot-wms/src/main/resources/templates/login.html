<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<main class="login-wrap">
    <div class="login-card">
        <header>
            <strong>StockPilot</strong>
            <p>Warehouse management</p>
        </header>
        <form class="stack" th:action="@{/login}" method="post">
            <div class="flash error" role="alert" th:if="${param.error}">Wrong username or password.</div>
            <div class="flash success" role="status" th:if="${param.logout}">You're signed out.</div>
            <label>Username
                <input type="text" name="username" autocomplete="username" autofocus required>
            </label>
            <label>Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="btn act">Sign in</button>
            <p class="muted" style="font-size:13px;margin:0">Starter accounts: admin / admin123 (office), picker / picker123 (floor).</p>
        </form>
    </div>
</main>
</body>
</html>
