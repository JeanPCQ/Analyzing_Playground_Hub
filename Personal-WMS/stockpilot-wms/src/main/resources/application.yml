# StockPilot WMS - main configuration
# Your database username/password go in config/local.yml (not committed to Git).
# Copy config/local.yml.example to config/local.yml and fill it in.

spring:
  application:
    name: stockpilot-wms
  config:
    import: optional:file:./config/local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/wms?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${WMS_DB_USERNAME:wms_app}
    password: ${WMS_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never creates or changes tables.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

server:
  port: 8080
  # Listen on all network interfaces so phones on the same Wi-Fi can reach the floor screens.
  address: 0.0.0.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wms:
  api:
    # How long an API session token stays valid without being used.
    session-timeout-minutes: 60

logging:
  file:
    name: logs/wms.log
  level:
    com.stockpilot: INFO

---
# Sandbox: same app, separate database. Run with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=sandbox
spring:
  config:
    activate:
      on-profile: sandbox
  datasource:
    url: jdbc:mysql://localhost:3306/wms_sandbox?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
