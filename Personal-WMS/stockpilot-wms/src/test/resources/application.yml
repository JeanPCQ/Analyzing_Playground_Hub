# Test configuration: in-memory H2 database in MySQL mode.
# Hibernate builds the tables from the entities, so tests need no MySQL server.
spring:
  datasource:
    url: jdbc:h2:mem:wmstest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

wms:
  api:
    session-timeout-minutes: 60
