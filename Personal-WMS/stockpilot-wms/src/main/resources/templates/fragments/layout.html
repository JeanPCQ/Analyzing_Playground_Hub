<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | StockPilot'">StockPilot</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Office navigation -->
<header th:fragment="nav" class="topbar">
    <a class="brand" th:href="@{/}">StockPilot</a>
    <nav aria-label="Main">
        <a th:href="@{/parts}">Parts</a>
        <a th:href="@{/inventory}">Inventory</a>
        <a th:href="@{/purchase-orders}">Purchase orders</a>
        <a th:href="@{/sales-orders}">Sales orders</a>
        <a th:href="@{/locations}">Locations</a>
        <a th:href="@{/vendors}">Vendors</a>
        <a th:href="@{/customers}">Customers</a>
        <a th:href="@{/floor}">Floor screens</a>
    </nav>
    <div class="user">
        <span sec:authentication="name">user</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="linkish">Sign out</button>
        </form>
    </div>
</header>

<!-- Floor navigation -->
<header th:fragment="floorbar" class="floor-bar">
    <a th:href="@{/floor}">StockPilot floor</a>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="linkish">Sign out <span sec:authentication="name"></span></button>
    </form>
</header>

<!-- Success / error messages after an action -->
<div th:fragment="flash" th:remove="tag">
    <div class="flash success" role="status" th:if="${success}" th:text="${success}"></div>
    <div class="flash error" role="alert" th:if="${error}" th:text="${error}"></div>
</div>

</body>
</html>
