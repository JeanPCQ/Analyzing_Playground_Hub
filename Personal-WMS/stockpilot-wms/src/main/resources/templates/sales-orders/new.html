<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New sales order')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head"><h1>New sales order</h1></div>
    <section class="panel">
        <form class="stack" th:action="@{/sales-orders}" method="post">
            <label>Customer
                <select name="customerId" required>
                    <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name + ' (' + c.code + ')'}">Customer</option>
                </select>
            </label>
            <div class="actions">
                <button type="submit" class="btn act">Create sales order</button>
                <a class="btn quiet" th:href="@{/sales-orders}">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
