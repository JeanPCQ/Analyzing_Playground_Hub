<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vendors')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head"><div><h1>Vendors</h1><p class="sub">Who we buy from.</p></div></div>
    <section class="panel">
        <h2>Add a vendor</h2>
        <form class="inline" th:action="@{/vendors}" method="post">
            <label>Code <input type="text" name="code" maxlength="20" required></label>
            <label>Name <input type="text" name="name" maxlength="100" required></label>
            <label>Email <input type="email" name="email" maxlength="100"></label>
            <label>Phone <input type="tel" name="phone" maxlength="30"></label>
            <button class="btn act" type="submit">Add vendor</button>
        </form>
    </section>
    <section class="panel">
        <div class="table-wrap">
            <table>
                <thead><tr><th>Code</th><th>Name</th><th>Email</th><th>Phone</th></tr></thead>
                <tbody>
                <tr th:each="v : ${vendors}">
                    <td><strong th:text="${v.code}">CODE</strong></td>
                    <td th:text="${v.name}">name</td>
                    <td th:text="${v.email}">email</td>
                    <td th:text="${v.phone}">phone</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
