<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Receive')}"></head>
<body class="floor">
<header th:replace="~{fragments/layout :: floorbar}"></header>
<main class="floor-page">
    <h1>Receive</h1>
    <p class="card" th:if="${#lists.isEmpty(orders)}">Nothing to receive right now.</p>
    <a class="card card-link" th:each="po : ${orders}" th:href="@{/floor/receive/{id}(id=${po.id})}">
        <h2 th:text="${po.poNumber}">PO</h2>
        <div th:text="${po.vendor.name}">Vendor</div>
        <span class="pill" th:classappend="${@fmt.statusClass(po.status)}" th:text="${@fmt.label(po.status)}">Status</span>
    </a>
</main>
</body>
</html>
