<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong | StockPilot</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="login-wrap">
    <div class="login-card">
        <header>
            <strong th:text="${status == 403} ? 'No access' : (${status == 404} ? 'Page not found' : 'Something went wrong')">Error</strong>
            <p th:text="'Error ' + ${status}">Error</p>
        </header>
        <div style="padding:22px">
            <p th:if="${status == 403}">Your account can't open this page. Warehouse accounts can use the floor screens.</p>
            <p th:if="${status == 404}">That address doesn't exist. Check the link or go back.</p>
            <p th:if="${status != 403 and status != 404}">The server hit an unexpected problem. The details are in logs/wms.log.</p>
            <div class="actions">
                <a class="btn act" th:href="@{/}">Go to dashboard</a>
                <a class="btn quiet" th:href="@{/floor}">Go to floor screens</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
