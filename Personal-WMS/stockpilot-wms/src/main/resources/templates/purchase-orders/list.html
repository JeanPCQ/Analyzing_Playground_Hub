<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Purchase orders')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head">
        <div>
            <h1>Purchase orders</h1>
            <p class="sub">What we've ordered from vendors and what has arrived.</p>
        </div>
        <a class="btn act" th:href="@{/purchase-orders/new}">New purchase order</a>
    </div>
    <section class="panel">
        <p class="empty" th:if="${#lists.isEmpty(orders)}">No purchase orders yet. Create one to restock.</p>
        <div class="table-wrap" th:unless="${#lists.isEmpty(orders)}">
            <table>
                <thead><tr><th>PO</th><th>Vendor</th><th>Status</th><th>Ordered</th><th>Expected</th><th class="num">Lines</th></tr></thead>
                <tbody>
                <tr th:each="po : ${orders}">
                    <td><a th:href="@{/purchase-orders/{id}(id=${po.id})}" th:text="${po.poNumber}">PO</a></td>
                    <td th:text="${po.vendor.name}">Vendor</td>
                    <td><span class="pill" th:classappend="${@fmt.statusClass(po.status)}" th:text="${@fmt.label(po.status)}">Status</span></td>
                    <td th:text="${po.orderDate}">date</td>
                    <td th:text="${po.expectedDate}">date</td>
                    <td class="num" th:text="${#lists.size(po.lines)}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
