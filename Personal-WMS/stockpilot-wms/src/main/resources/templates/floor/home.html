<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Floor')}"></head>
<body class="floor">
<header th:replace="~{fragments/layout :: floorbar}"></header>
<main class="floor-page">
    <a class="tile" th:href="@{/floor/receive}">
        <strong>Receive</strong>
        <span th:text="${receiveCount} + ' purchase orders waiting'">0 waiting</span>
    </a>
    <a class="tile" th:href="@{/floor/pick}">
        <strong>Pick</strong>
        <span th:text="${pickCount} + ' sales orders to pick'">0 to pick</span>
    </a>
    <a class="tile dark" th:href="@{/floor/lookup}">
        <strong>Look up an item</strong>
        <span>See where a part is and how many</span>
    </a>
</main>
</body>
</html>
