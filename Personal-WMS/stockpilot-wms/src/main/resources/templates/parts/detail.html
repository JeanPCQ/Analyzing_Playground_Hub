<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${summary.part.partNumber})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page" th:with="part=${summary.part}">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head">
        <div>
            <h1 th:text="${part.partNumber}">PN</h1>
            <p class="sub" th:text="${part.description}">Description</p>
        </div>
        <a class="btn quiet" th:href="@{/parts/{id}/edit(id=${part.id})}">Edit part</a>
    </div>

    <div class="figures">
        <div class="figure"><strong th:text="${@fmt.qty(summary.onHand)}">0</strong><span>on hand</span></div>
        <div class="figure"><strong th:text="${@fmt.qty(summary.allocated)}">0</strong><span>allocated to orders</span></div>
        <div class="figure" th:classappend="${summary.lowStock} ? 'warn'"><strong th:text="${@fmt.qty(summary.available)}">0</strong><span>available</span></div>
        <div class="figure"><strong th:text="${@fmt.qty(part.reorderPoint)}">0</strong><span>reorder point</span></div>
        <div class="figure"><strong th:text="${@fmt.money(part.standardCost)}">$0</strong><span>standard cost</span></div>
    </div>

    <div class="grid-2">
        <section class="panel">
            <h2>Stock by location</h2>
            <p class="empty" th:if="${#lists.isEmpty(levels)}">No stock anywhere yet. Receive a purchase order or make an adjustment.</p>
            <table th:unless="${#lists.isEmpty(levels)}">
                <thead><tr><th>Location</th><th>Zone</th><th class="num">On hand</th></tr></thead>
                <tbody>
                <tr th:each="l : ${levels}">
                    <td th:text="${l.location.code}">LOC</td>
                    <td th:text="${l.location.zone}">Z</td>
                    <td class="num" th:classappend="${@fmt.neg(l.qtyOnHand)} ? 'neg'" th:text="${@fmt.qty(l.qtyOnHand)}">0</td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="panel">
            <h2>History</h2>
            <p class="empty" th:if="${#lists.isEmpty(transactions)}">No movements yet.</p>
            <div class="table-wrap" th:unless="${#lists.isEmpty(transactions)}">
                <table>
                    <thead><tr><th>When</th><th>Type</th><th>Where</th><th>Ref</th><th class="num">Qty</th></tr></thead>
                    <tbody>
                    <tr th:each="t : ${transactions}">
                        <td class="muted" th:text="${@fmt.dateTime(t.createdAt)}">date</td>
                        <td th:text="${@fmt.label(t.type)}">type</td>
                        <td th:text="${t.location.code}">loc</td>
                        <td th:text="${t.reference}">ref</td>
                        <td class="num" th:classappend="${@fmt.neg(t.qtyChange)} ? 'neg'" th:text="${@fmt.qty(t.qtyChange)}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>
</body>
</html>
