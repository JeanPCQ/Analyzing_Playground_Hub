# Runs the tests on every push and pull request.
# Note: the build starts red on purpose. Two tests reproduce bugs WMS-101 and WMS-102.
# Fixing those tickets turns it green.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test the WMS
        run: ./mvnw -B verify

      - name: Test the connector
        run: ./mvnw -B -f connector/pom.xml verify
