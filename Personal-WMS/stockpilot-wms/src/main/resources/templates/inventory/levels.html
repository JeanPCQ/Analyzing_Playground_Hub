<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventory')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head">
        <div>
            <h1>Inventory</h1>
            <p class="sub">Every part in every location, in eaches.</p>
        </div>
        <div class="actions">
            <a class="btn quiet" th:href="@{/inventory/transactions}">History</a>
            <a class="btn quiet" th:href="@{/inventory/export.csv}">Export CSV</a>
        </div>
    </div>

    <div class="grid-2">
        <section class="panel">
            <h2>Adjust stock</h2>
            <form class="stack" th:action="@{/inventory/adjust}" method="post">
                <label>Part
                    <select name="partId" required>
                        <option th:each="p : ${parts}" th:value="${p.id}" th:text="${p.partNumber + ' - ' + p.description}">Part</option>
                    </select>
                </label>
                <label>Location
                    <select name="locationId" required>
                        <option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.code}">LOC</option>
                    </select>
                </label>
                <label>Change (use a minus sign to remove)
                    <input type="number" name="qtyChange" step="any" required>
                </label>
                <label>Reason
                    <input type="text" name="reason" maxlength="255" placeholder="e.g. Damaged in handling" required>
                </label>
                <div><button class="btn act" type="submit">Save adjustment</button></div>
            </form>
        </section>

        <section class="panel">
            <h2>Move stock between locations</h2>
            <form class="stack" th:action="@{/inventory/transfer}" method="post">
                <label>Part
                    <select name="partId" required>
                        <option th:each="p : ${parts}" th:value="${p.id}" th:text="${p.partNumber + ' - ' + p.description}">Part</option>
                    </select>
                </label>
                <label>From
                    <select name="fromLocationId" required>
                        <option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.code}">LOC</option>
                    </select>
                </label>
                <label>To
                    <select name="toLocationId" required>
                        <option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.code}">LOC</option>
                    </select>
                </label>
                <label>Quantity <input type="number" name="qty" step="any" min="0" required></label>
                <div><button class="btn act" type="submit">Move stock</button></div>
            </form>
        </section>
    </div>

    <section class="panel">
        <h2>Stock on hand</h2>
        <p class="empty" th:if="${#lists.isEmpty(levels)}">Nothing in stock yet.</p>
        <div class="table-wrap" th:unless="${#lists.isEmpty(levels)}">
            <table>
                <thead><tr><th>Part</th><th>Description</th><th>Location</th><th>Zone</th><th class="num">On hand</th></tr></thead>
                <tbody>
                <tr th:each="l : ${levels}">
                    <td><a th:href="@{/parts/{id}(id=${l.part.id})}" th:text="${l.part.partNumber}">PN</a></td>
                    <td th:text="${l.part.description}">desc</td>
                    <td th:text="${l.location.code}">LOC</td>
                    <td th:text="${l.location.zone}">Z</td>
                    <td class="num" th:classappend="${@fmt.neg(l.qtyOnHand)} ? 'neg'" th:text="${@fmt.qty(l.qtyOnHand)}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
