<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${po.poNumber})}"></head>
<body class="floor">
<header th:replace="~{fragments/layout :: floorbar}"></header>
<main class="floor-page">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1><span th:text="${po.poNumber}">PO</span>
        <span class="pill" th:classappend="${@fmt.statusClass(po.status)}" th:text="${@fmt.label(po.status)}">Status</span></h1>
    <p th:unless="${po.receivable}" class="card">This purchase order is closed. <a th:href="@{/floor/receive}">Back to the list</a></p>

    <div class="card" th:each="line : ${po.lines}" th:classappend="${!@fmt.pos(line.qtyRemaining)} ? 'done'">
        <h2 th:text="${line.part.partNumber}">PN</h2>
        <div class="muted" th:text="${line.part.description}">desc</div>
        <div class="big-qty" th:text="${@fmt.qty(line.qtyRemaining)} + ' ' + ${line.uom.code}">0 EA</div>
        <div class="muted" th:text="'left of ' + ${@fmt.qty(line.qtyOrdered)} + ' ' + ${line.uom.code} + ' ordered'">left</div>

        <form class="floor-form" th:if="${po.receivable and @fmt.pos(line.qtyRemaining)}"
              th:action="@{/floor/receive/{id}(id=${po.id})}" method="post">
            <input type="hidden" name="lineId" th:value="${line.id}">
            <input type="number" name="qty" step="any" min="0" inputmode="decimal"
                   th:placeholder="'Quantity in ' + ${line.uom.code}" required>
            <select name="locationId" required aria-label="Put away to">
                <option th:each="l : ${locations}" th:value="${l.id}" th:text="'Put away to ' + ${l.code}">LOC</option>
            </select>
            <button class="btn act" type="submit">Receive</button>
        </form>
    </div>
    <a class="btn quiet" th:href="@{/floor/receive}">Back to purchase orders</a>
</main>
</body>
</html>
