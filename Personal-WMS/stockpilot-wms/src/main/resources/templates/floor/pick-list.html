<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pick')}"></head>
<body class="floor">
<header th:replace="~{fragments/layout :: floorbar}"></header>
<main class="floor-page">
    <h1>Pick</h1>
    <p class="card" th:if="${#lists.isEmpty(orders)}">Nothing to pick right now.</p>
    <a class="card card-link" th:each="so : ${orders}" th:href="@{/floor/pick/{id}(id=${so.id})}">
        <h2 th:text="${so.soNumber}">SO</h2>
        <div th:text="${so.customer.name}">Customer</div>
        <span class="pill" th:classappend="${@fmt.statusClass(so.status)}" th:text="${@fmt.label(so.status)}">Status</span>
    </a>
</main>
</body>
</html>
