<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${so.soNumber})}"></head>
<body class="floor">
<header th:replace="~{fragments/layout :: floorbar}"></header>
<main class="floor-page">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1><span th:text="${so.soNumber}">SO</span>
        <span class="pill" th:classappend="${@fmt.statusClass(so.status)}" th:text="${@fmt.label(so.status)}">Status</span></h1>
    <p th:unless="${so.pickable}" class="card">
        <span th:if="${so.picked}">All lines are picked. The office can ship it now.</span>
        <span th:unless="${so.picked}">This order can't be picked.</span>
        <a th:href="@{/floor/pick}">Back to the list</a>
    </p>

    <div class="card" th:each="line : ${so.lines}" th:classappend="${line.fullyPicked} ? 'done'">
        <h2 th:text="${line.part.partNumber}">PN</h2>
        <div class="muted" th:text="${line.part.description}">desc</div>
        <div class="big-qty" th:text="${@fmt.qty(line.qtyRemaining)} + ' EA'">0 EA</div>
        <div class="muted" th:text="'left of ' + ${@fmt.qty(line.qtyOrdered)} + ' ordered'">left</div>

        <ul class="bins">
            <li th:each="b : ${binsByLine[line.id]}">
                <span th:text="${b.location.code}">LOC</span>
                <strong th:classappend="${@fmt.neg(b.qtyOnHand)} ? 'neg'" th:text="${@fmt.qty(b.qtyOnHand)}">0</strong>
            </li>
        </ul>

        <form class="floor-form" th:if="${so.pickable and !line.fullyPicked}"
              th:action="@{/floor/pick/{id}(id=${so.id})}" method="post">
            <input type="hidden" name="lineId" th:value="${line.id}">
            <select name="locationId" required aria-label="Pick from">
                <option th:each="b : ${binsByLine[line.id]}" th:value="${b.location.id}"
                        th:text="'Pick from ' + ${b.location.code} + ' (' + ${@fmt.qty(b.qtyOnHand)} + ' there)'">LOC</option>
            </select>
            <input type="number" name="qty" step="any" min="0" inputmode="decimal" placeholder="Quantity picked" required>
            <button class="btn act" type="submit">Pick</button>
        </form>
    </div>
    <a class="btn quiet" th:href="@{/floor/pick}">Back to orders</a>
</main>
</body>
</html>
